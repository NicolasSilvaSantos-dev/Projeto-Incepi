<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tampas | Incepi do Brasil</title>
        
        <link rel="icon" href="../../assets/imagens/icon-site.png" type="image/png">
        <!-- Vinculação do CSS Limpo/Personalizado -->
        <link rel="stylesheet" href="../assets/css/style.css">
        <script src="../../assets/js/include-header-footer.js" ></script>
    </head>
    <body>

        

        <main id="conteudo-principal">
            <article class="produto-detalhe">
                <h1>Tampas</h1>

                <section class="produto-principal">
                    <div class="produto-midia">
                        <figure>
                            <img src="../../assets/imagens/tampas.jpg" alt="Conjunto de tampas plásticas">
                        </figure>
                    </div>

                    <div class="produto-especificacoes">
                        <p><strong>MATÉRIA-PRIMA BÁSICA:</strong><br>PP CP442XP Braskem</p>
                        
                        <p><strong>FECHAMENTO:</strong></p>
                        <ul>
                            <li>TAMPA COM LACRE</li>
                            <li>VÁLVULA DE SEGURANÇA</li>
                            <li>PIGMENTAÇÃO</li>
                        </ul>
                    </div>
                </section>

                <hr>

                <!-- Formulário para Orçamento / Venda -->
                <section class="produto-orcamento">
                    <h2>Solicitar Cotação para Tampas</h2>
                    <form action="enviar-orcamento.php" method="post">
                        <input type="hidden" name="produto_interesse" value="Tampas">

                        <div class="form-group">
                            <label for="nome">Nome Completo:*</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail:*</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone / WhatsApp:*</label>
                            <input 
                                type="tel" 
                                id="telefone" 
                                name="telefone" 
                                required 
                                maxlength="15"
                                pattern="(\([0-9]{2}\)\s?|[0-9]{2}\s?)[0-9]{4,5}-?[0-9]{4}" 
                                placeholder="(11) 99999-9999"
                                title="Digite o DDD e o número (ex: 11999999999 ou (11) 99999-9999)">
                        </div>

                        <div class="form-group">
                            <label for="empresa">Empresa:</label>
                            <input type="text" id="empresa" name="empresa">
                        </div>

                        <div class="form-group">
                            <label for="quantidade">Quantidade Desejada (unidades):*</label>
                            <input type="number" id="quantidade" name="quantidade" min="1" required>
                        </div>

                        <div class="form-group">
                            <label for="mensagem">Observações / Mensagem:</label>
                            <textarea id="mensagem" name="mensagem" rows="4"></textarea>
                        </div>

                        <button type="submit">Enviar Solicitação de Orçamento</button>
                    </form>
                </section>

            </article>
        </main>


    </body>
</html>
